<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agrinho 2026 - Quiz Educativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🌱 Agrinho 2026 - Quiz Educativo</h1>

    <div id="start-screen">
        <p>Teste seus conhecimentos sobre sustentabilidade, cidadania e o mundo ao seu redor!</p>
        <button id="start-btn">Começar</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="question-container">
            <p id="question"></p>
        </div>
        <div id="answer-buttons">
            <!-- Botões de resposta serão gerados aqui -->
        </div>
        <p id="feedback"></p>
    </div>

    <div id="result-screen" class="hidden">
        <h2>🎉 Fim do Quiz!</h2>
        <p>Sua pontuação: <span id="final-score"></span></p>
        <button id="restart-btn">Jogar Novamente</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
