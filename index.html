<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Pragas Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🌱 Detector de Pragas Interativo</h1>
    <p>Arraste cada planta para o setor correto antes que o tempo acabe!</p>

    <div class="game-info">
        <h2 id="score">Pontuação: 0</h2>
        <h2 id="timer">Tempo: 30s</h2>
    </div>

    <div class="controls">
        <button id="btnPause">Pausar ⏸️</button>
        <button id="btnRestart">Recomeçar 🔄</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
